---
- name: Print type node
  ansible.builtin.debug:
    var: swarm_join_type

- name: Swarm join
  vars:
    token: "{{ lookup('file', '../../tokens/token-{{ swarm_join_type }}') }}"
  ansible.builtin.command: docker swarm join --token {{ token }} {{ swarm_addr }}:2377


