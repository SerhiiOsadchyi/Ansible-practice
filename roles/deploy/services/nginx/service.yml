- name: "[{{ service_name }}]: Config configuration"
  include: "../config.yml"
  loop:
    - nginx.conf
  loop_control:
    loop_var: config_item

- name: "[{{ service_name }}]: Service deployment"
  block:
    - name: "[{{ service_name }}]: Deploy service"
      community.docker.docker_swarm_service:
        name: "{{ service_name }}"
        image: "nginx:{{ service_version }}"
        networks:
          - name: "{{ deploy_network_name }}"
        publish:
          - mode: "ingress"
            protocol: "tcp"
            published_port: 80
            target_port: 80
        configs:
          - config_name: nginx.conf
            filename: "/etc/nginx/nginx.conf"
  tags: "{{ service_name }}"
