- name: "[{{ name }}]: Service deployment"
  block:
    - name: "[{{ name }}]: Deploy service"
      community.docker.docker_swarm_service:
        name: "{{ name }}"
        image: "{{ registry_name }}{{ name }}:{{ version }}"
        force_update: true
        networks:
          - name: "{{ deploy_network_name }}"
        publish:
          - mode: "ingress"
            protocol: "tcp"
            published_port: 3001
            target_port: 80
  tags: "{{ name }}"
