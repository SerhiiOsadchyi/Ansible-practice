---
- name: Install Docker
  become: true
  block:
    - name: Add universe packages
      ansible.builtin.apt_repository:
        repo: "deb http://us.archive.ubuntu.com/ubuntu/ {{ ansible_distribution_release }} universe"
        state: present

    - name: Install certificates
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        update-cache: true
        cache_valid_time: 86400

    - name: Folder of the keyrings must be exists
      ansible.builtin.file:
        state: directory
        mode: "0755"
        path: /etc/apt/keyrings

    - name: Install the APT key of Docker's APT repo
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: a+r

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        filename: docker
        repo: >
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        state: present
        update_cache: true

    - name: Install Docker-ce
      ansible.builtin.apt:
        name: 
          - python3-pip
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: true
      debugger: on_failed

    - name: Hold Docker CE packages
      ansible.builtin.command: apt-mark hold docker-ce docker-ce-cli docker-ce-rootless-extras containerd.io docker-compose-plugin
      changed_when: false

    - name: Enable and start Docker services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - docker.service
        - containerd.service

    - name: Check Docker is run
      ansible.builtin.command: docker --version
      register: docker_valid

    - name: Print all available facts
      ansible.builtin.debug:
        var: ansible_facts

    - name: Print Docker
      ansible.builtin.debug:
        msg: Docker {{ docker_valid }} 

- name: install 'Docker SDK for Python'
  block:
    - name: pip install docker
      pip:
        name: docker

- name: Final
  become: true
  block:
    - name: Add user to Docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: System reboot
      ansible.builtin.reboot:

